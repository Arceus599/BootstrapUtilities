<html>

<head>
    <title>My Science Lab</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>

    </style>
</head>

<body>
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>My Science Lab</h1>
            <p class="lead">Welcome to my fun science lab</p>

            <button class="btn btn-warning">Chemistry</button>

            <button class="btn btn-success">Physics</button>

            <button class="btn btn-danger">Biology</button>

            <button class="btn btn-primary">Astronomy</button>
        </div>
    </div>

    <div class="container">
        <h2 class="section-title">Experiments completed<span class="badge badge-danger">15</span></h2>

        <p>Chemistry<span class="badge badge-warning">7 Experiments</span></p>

        <p>Physics<span class="badge badge-success">1 Experiments</span></p>

        <p>Biology<span class="badge badge-danger">3 Experiments</span></p>

        <p>Astronomy<span class="badge badge-primary">4 Experiments</span></p>

        <h2>Research Progress</h2>
        <p>Chemistry</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width: 57%;">57%</div>
        </div>

        <p>Physics</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width: 74%;">74%</div>
        </div>

        <p>Biology</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger" style="width: 97%;">97%</div>
        </div>

        <p>Astronomy</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" style="width: 85%;">85%</div>
        </div>
    </div>
</body>

</html>
